# Builds the Android app (Go core AAR + APKs) on every push to main and on tags.
# A tag v* publishes the APKs as a GitHub release (prerelease for -alpha/-beta/-rc).
name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          # The runner image ships an SDK; fetch the command-line tools only if absent.
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$sdkm" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            sdkm=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Go core → AAR
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018 scripts/build-android-core.sh

      - name: Lint, tests, APKs
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Collect APKs
        run: |
          ver=${GITHUB_REF_NAME//\//-}
          mkdir -p dist
          for f in android/app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-debug\.apk$//')
            cp "$f" "dist/meshmsg-$ver-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Test build of the mesh-msg Android app (M5).

            - Default relay: `eu-1` (http://87.106.5.192).
            - Which APK: `arm64-v8a` for almost every phone; `universal` if unsure.
            - Signed with the project's public test key, not a release key. Later test
              builds install over this one.
            - BLE and USB LoRa have not been tried on real phones yet.
