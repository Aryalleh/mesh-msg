# Builds the apps on every push to main and on tags. A tag v* publishes a
# GitHub release (prerelease for -alpha/-beta/-rc) with the Android APKs, the
# Linux desktop binaries, the relay and the Mava board's flashers (Linux and
# Android), all
# stamped with the tag's version. A manual run (workflow_dispatch) with
# release_tag does the same without pushing a tag first: the release step
# creates the tag on the commit it built.
#
# Versions: name = tag without "v" (e.g. 0.1.0-alpha4), or 0.0.0-dev+<sha> on
# main. Android versionCode = this workflow's run number, which only grows, so
# each APK installs over the previous one. Do not rename this file: that
# restarts the run number and would break updates.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this new tag (e.g. v0.1.1-beta7); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag=$GITHUB_REF_NAME; fi
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+[0-9]*)?$ ]] || { echo "::error::release_tag must look like v1.2.3 or v1.2.3-beta4"; exit 1; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::releases are cut from main only"; exit 1; }
            tag=$RELEASE_TAG
          fi
          if [[ -n "$tag" ]]; then name=${tag#v}; else name=0.0.0-dev+${GITHUB_SHA::7}; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          echo "version $name, code $((GITHUB_RUN_NUMBER + 100)), release tag '${tag}'"

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          # The runner image ships an SDK; fetch the command-line tools only if absent.
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$sdkm" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            sdkm=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Go core → AAR
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018 scripts/build-android-core.sh

      - name: Lint, tests, APKs
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon -PversionName='${{ needs.version.outputs.name }}' -PversionCode='${{ needs.version.outputs.code }}' \
            :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee ../gradle.log

      - name: Report build errors
        if: failure()
        run: |
          # Kotlin compile errors, lint errors and failed tests as annotations (readable without logs access).
          grep -E '^e: |Error: |FAILED|Exception|What went wrong' -A2 gradle.log | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
          for f in android/app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E 'Error:' -A1 "$f" | head -20 | while IFS= read -r l; do echo "::error::lint ${l//%/%25}"; done
          done

      - name: Collect APKs
        run: |
          ver='${{ needs.version.outputs.name }}'
          mkdir -p dist
          for f in android/app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-debug\.apk$//')
            cp "$f" "dist/meshmsg-$ver-$abi.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  desktop:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: meshd + mesh for Linux
        run: |
          ver='${{ needs.version.outputs.name }}'
          mkdir -p dist
          for arch in amd64 arm64; do
            d=meshmsg-desktop-$ver-linux-$arch
            mkdir -p "$d"
            for cmd in meshd mesh; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$ver" -o "$d/$cmd" ./desktop/cmd/$cmd
            done
            cp desktop/README.md desktop/deploy/meshd.service desktop/deploy/install.sh "$d/"
            tar czf "dist/$d.tar.gz" "$d"
            r=meshmsg-relay-$ver-linux-$arch
            mkdir -p "$r"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$ver" -o "$r/meshmsg-relay" ./server/cmd/relay
            cp server/deploy/install.sh server/deploy/meshmsg-relay.service server/deploy/relay.example.json server/deploy/README.md "$r/"
            tar czf "dist/$r.tar.gz" "$r"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/

  # The Mava board: ESP32-S3 firmware + web client file system + keyboard
  # module images + Espressif's standalone esptool, as one Linux flasher
  # bundle (docs/flashing.md).
  board:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-board-${{ hashFiles('firmware/platformio.ini', 'firmware/keyboard/platformio.ini') }}

      - name: Board flasher bundle
        run: |
          pip install platformio
          VERSION='${{ needs.version.outputs.name }}' scripts/build-flasher.sh
          mkdir -p out images && mv dist/*.tar.gz out/ && mv dist/board-images.tar images/

      - uses: actions/upload-artifact@v4
        with:
          name: board
          path: out/

      # For the Android flasher only, not a release asset.
      - uses: actions/upload-artifact@v4
        with:
          name: board-images
          path: images/

  # The Mava board's Android tools: the flasher (android/flasher: the same
  # images, written over USB-OTG from a phone) and Mava Screen (android/screen:
  # the handheld's screen on the phone over USB).
  flasher-android:
    needs: [version, board]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$sdkm" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            sdkm=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: board-images
          path: imgs

      - name: Lint, tests, APK
        run: |
          set -o pipefail
          tar -xf imgs/board-images.tar -C imgs
          test -s imgs/board-images/firmware.bin
          cd android
          ./gradlew --no-daemon -PversionName='${{ needs.version.outputs.name }}' -PversionCode='${{ needs.version.outputs.code }}' \
            -PboardImages="$GITHUB_WORKSPACE/imgs/board-images" \
            :boardlink:lintDebug :boardlink:testDebugUnitTest \
            :flasher:lintDebug :flasher:testDebugUnitTest :flasher:assembleDebug \
            :screen:lintDebug :screen:testDebugUnitTest :screen:assembleDebug 2>&1 | tee ../gradle.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |Error: |FAILED|Exception|What went wrong' -A2 gradle.log | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/flasher/build/outputs/apk/debug/flasher-debug.apk "dist/mava-board-flasher-${{ needs.version.outputs.name }}-android.apk"
          cp android/screen/build/outputs/apk/debug/screen-debug.apk "dist/mava-screen-${{ needs.version.outputs.name }}-android.apk"
          unzip -l "dist/mava-board-flasher-${{ needs.version.outputs.name }}-android.apk" | grep -q 'assets/board/firmware.bin'
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: flasher-android
          path: dist/

  release:
    if: needs.version.outputs.tag != ''
    needs: [version, android, desktop, board, flasher-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Drop build-only files
        run: rm -f dist/board-images.tar

      # Update check (roadmap B7, decisions D20): every release carries a
      # release.json signed with the release key (secret RELEASE_SIGNING_KEY,
      # kept outside the repository). No key, no notes or a manifest that
      # doesn't verify: the release fails.
      - name: Signed release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          tag='${{ needs.version.outputs.tag }}'
          ver='${{ needs.version.outputs.name }}'
          for l in en fa; do
            [ -s "docs/release-notes/$tag.$l.md" ] || { echo "::error::docs/release-notes/$tag.$l.md is missing"; exit 1; }
          done
          min=$(grep -v '^#' docs/release-notes/min-supported 2>/dev/null | grep . | tail -1 || true)
          go run ./tools/release-manifest sign -version "$ver" -dir dist \
            -base-url "https://github.com/${{ github.repository }}/releases/download/$tag" \
            -page "https://github.com/${{ github.repository }}/releases/tag/$tag" \
            -notes-en "docs/release-notes/$tag.en.md" -notes-fa "docs/release-notes/$tag.fa.md" \
            -min-supported "$min" > release.json
          go run ./tools/release-manifest verify release.json
          mv release.json dist/
          {
            echo "Mava $ver (Android versionCode ${{ needs.version.outputs.code }})."
            echo
            cat "docs/release-notes/$tag.en.md"
            echo
            echo '<div dir="rtl">'
            echo
            cat "docs/release-notes/$tag.fa.md"
            echo
            echo '</div>'
            echo
            cat <<'NOTES'
          **Android**: `arm64-v8a` for almost every phone, `universal` if unsure. Installs as an
          update over earlier builds (same signing key, data is kept).
          **Desktop**: `meshmsg-desktop-…-linux-amd64.tar.gz` (or arm64) holds `meshd` + `mesh`,
          see the README inside. Later updates: `mesh update`.
          **Mava board (Linux flasher)**: `mava-board-flasher-…-linux.tar.gz` holds the ESP32-S3
          firmware, the web client for iPhones and the keyboard-module images, with esptool.
          `./mava-flash board --erase` the first time, then `./mava-flash board`; see README.md inside.
          **Mava board (Android flasher)**: `mava-board-flasher-…-android.apk` writes the same firmware
          from a phone over a USB-OTG adapter (Install everything / Update firmware only) and shows
          the board's log: hotspot name, device password, BLE passkey; it also sets the board's Wi-Fi.
          **Mava Screen**: `mava-screen-…-android.apk` shows the handheld's screen on a phone over USB,
          with touch, the handheld's keys and typing from the phone's keyboard.
          **Relay server**: `meshmsg-relay-…-linux-amd64.tar.gz`. Run `sudo sh install.sh` inside
          (it asks for your Mava account id for the admin panel at `/admin`). Relays serve the
          signed release manifest at `/v1/release`.

          `release.json` is the signed release manifest the apps' update check reads.
          Default relay: `eu-1` (https://eu-1.mfadem.ir, or http://87.106.5.192 if the domain is blocked). Account backup: Settings → Back up
          account on Android, `mesh identity export` on desktop.
          NOTES
          } > body.md

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && ls -la

      # Creates the tag on the built commit when the run was started by hand.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/*
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          body_path: body.md
