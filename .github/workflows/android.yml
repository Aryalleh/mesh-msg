# Builds the apps on every push to main and on tags. A tag v* publishes a
# GitHub release (prerelease for -alpha/-beta/-rc) with the Android APKs and
# the Linux desktop binaries, all stamped with the tag's version.
#
# Versions: name = tag without "v" (e.g. 0.1.0-alpha4), or 0.0.0-dev+<sha> on
# main. Android versionCode = this workflow's run number, which only grows, so
# each APK installs over the previous one. Do not rename this file: that
# restarts the run number and would break updates.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name=${GITHUB_REF_NAME#v}; else name=0.0.0-dev+${GITHUB_SHA::7}; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          echo "version $name, code $((GITHUB_RUN_NUMBER + 100))"

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          # The runner image ships an SDK; fetch the command-line tools only if absent.
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$sdkm" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            sdkm=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Go core → AAR
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018 scripts/build-android-core.sh

      - name: Lint, tests, APKs
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon -PversionName='${{ needs.version.outputs.name }}' -PversionCode='${{ needs.version.outputs.code }}' \
            lintDebug testDebugUnitTest assembleDebug 2>&1 | tee ../gradle.log

      - name: Report build errors
        if: failure()
        run: |
          # Kotlin compile errors, lint errors and failed tests as annotations (readable without logs access).
          grep -E '^e: |Error: |FAILED|Exception|What went wrong' -A2 gradle.log | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
          for f in android/app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E 'Error:' -A1 "$f" | head -20 | while IFS= read -r l; do echo "::error::lint ${l//%/%25}"; done
          done

      - name: Collect APKs
        run: |
          ver='${{ needs.version.outputs.name }}'
          mkdir -p dist
          for f in android/app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-debug\.apk$//')
            cp "$f" "dist/meshmsg-$ver-$abi.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  desktop:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: meshd + mesh for Linux
        run: |
          ver='${{ needs.version.outputs.name }}'
          mkdir -p dist
          for arch in amd64 arm64; do
            d=meshmsg-desktop-$ver-linux-$arch
            mkdir -p "$d"
            for cmd in meshd mesh; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$ver" -o "$d/$cmd" ./desktop/cmd/$cmd
            done
            cp desktop/README.md "$d/"
            tar czf "dist/$d.tar.gz" "$d"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            mesh-msg ${{ needs.version.outputs.name }} (Android versionCode ${{ needs.version.outputs.code }}).

            **Android** — `arm64-v8a` for almost every phone, `universal` if unsure. Installs as an
            update over earlier test builds (same public test key; not a release key).
            **Desktop** — `meshmsg-desktop-…-linux-amd64.tar.gz` (or arm64): `meshd` + `mesh`,
            see the README inside.

            Default relay: `eu-1` (http://87.106.5.192). Account backup: Settings → Back up
            account on Android, `mesh identity export` on desktop.
            BLE and USB LoRa have not been tried on real phones yet.
