# Go and firmware checks on every push and pull request. Android builds and releases are in
# android.yml (do not rename that one; its run number feeds the APK versionCode).
name: CI (Go + firmware)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (core, relay, desktop, simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Browser client (WebAssembly)
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./web/cmd/webclient

  firmware-host:
    name: Firmware host tests + LoRa end-to-end (simulated radio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y libssl-dev  # Meshtastic channel AES in the host tests
      - run: make -C firmware test
      - run: scripts/e2e-lora.sh

  firmware-boards:
    name: Firmware build (Mava board, ${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [mava_handheld_s3, mava_handheld_s3_v1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # Redirect instead of piping: `pio run | head` hangs when the pipe closes.
      - run: pio run -d firmware -e ${{ matrix.env }} > pio.log 2>&1 || { tail -n 60 pio.log; exit 1; }

  keyboard-module:
    name: Keyboard module build (RP2040, all three keyboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-keyboard-${{ hashFiles('firmware/keyboard/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware/keyboard > pio.log 2>&1 || { tail -n 60 pio.log; exit 1; }
