; mesh-msg LoRa node firmware — board layer (docs/firmware.md §1, §3, §7).
;
;   pio run                      build every board
;   pio run -e heltec_v3 -t upload
;   pio device monitor           decoded headers until a host (meshd) attaches
;
; The protocol, router, MAC, store and node application are in lib/ (pure C++17,
; tested on the host with `make test`); src/ only moves bytes between them and
; the SX1262 (RadioLib), the USB serial host link and LittleFS.
;
; Pin tables per board are build flags below. They follow the vendors'
; schematics / the usual open-source pin maps; VERIFY on your board before
; trusting a repeater on a roof. Region defaults to EU_868 (869.525 MHz, 10 %);
; change with `mesh lora set region=…` — check local rules before transmitting.

[platformio]
default_envs = heltec_v3, tbeam_s3, rak4631, techo
src_dir = src
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
lib_deps =
  jgromes/RadioLib@^7.3.0
build_unflags = -std=gnu++11 -std=gnu++14
build_src_flags = -Wall -Wextra
build_flags =
  -std=gnu++17
  -DMESH_DEFAULT_REGION=0
  -DMESH_FIRMWARE_VERSION=1
  -DRADIOLIB_EXCLUDE_LORAWAN=1

; ---------------------------------------------------------------- ESP32-S3
[esp32s3]
platform = espressif32
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; Heltec WiFi LoRa 32 V3: SX1262 on SPI (SCK 9, MISO 11, MOSI 10), TCXO 1.8 V,
; DIO2 drives the RF switch. Battery: ADC on GPIO1 behind a 390k/100k divider,
; enabled by pulling GPIO37 low.
[env:heltec_v3]
extends = esp32s3
board = heltec_wifi_lora_32_V3
build_flags =
  ${esp32s3.build_flags}
  -DBOARD_NAME=\"heltec_v3\"
  -DRADIO_SCK=9 -DRADIO_MISO=11 -DRADIO_MOSI=10
  -DRADIO_CS=8 -DRADIO_DIO1=14 -DRADIO_RST=12 -DRADIO_BUSY=13
  -DRADIO_TCXO_MV=1800 -DRADIO_DIO2_RF_SWITCH=1
  -DLED_PIN=35
  -DBATTERY_ADC_PIN=1 -DBATTERY_CTRL_PIN=37 -DBATTERY_CTRL_ACTIVE=0 -DBATTERY_MULT_X100=490

; LilyGO T-Beam Supreme (ESP32-S3): SX1262 on SPI (SCK 12, MISO 13, MOSI 11),
; TCXO 1.8 V, DIO2 RF switch. An AXP2101 PMU on I2C (SDA 42, SCL 41) powers
; the radio rail (ALDO2) — without it the SX1262 is dead, hence XPowersLib.
[env:tbeam_s3]
extends = esp32s3
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps =
  ${env.lib_deps}
  lewisxhe/XPowersLib@^0.2.6
build_flags =
  ${esp32s3.build_flags}
  -DBOARD_NAME=\"tbeam_s3\"
  -DRADIO_SCK=12 -DRADIO_MISO=13 -DRADIO_MOSI=11
  -DRADIO_CS=10 -DRADIO_DIO1=1 -DRADIO_RST=5 -DRADIO_BUSY=4
  -DRADIO_TCXO_MV=1800 -DRADIO_DIO2_RF_SWITCH=1
  -DHAS_PMU_AXP2101=1 -DPMU_SDA=42 -DPMU_SCL=41
  -DBATTERY_FROM_PMU=1

; ---------------------------------------------------------------- nRF52840
; Both nRF boards ship with the Adafruit UF2 bootloader + SoftDevice S140 6.1.1,
; which is what the nrf52840_dk_adafruit board definition in this platform
; expects (the pca10056 variant maps Arduino pin N to P0.N / P1.(N-32), so the
; pins below are raw port numbers). Flash: double-tap reset, then
; `pio run -e rak4631 -t upload` (nrfutil DFU over the USB serial port).
[nrf52]
platform = nordicnrf52
board = nrf52840_dk_adafruit
board_upload.protocols = nrfutil, jlink
upload_protocol = nrfutil
build_flags =
  ${env.build_flags}
  -DUSBCON -DUSE_TINYUSB
  -DUSB_VID=0x239A -DUSB_PID=0x8029
  -DUSB_MANUFACTURER=\"mesh-msg\" -DUSB_PRODUCT=\"LoRa\ node\"
  -DNRF52_RADIO_SPI_PINS=1
build_src_flags = ${env.build_src_flags} -Wno-unused-parameter   ; SoftDevice headers

; RAKwireless RAK4631 (WisBlock core): SX1262 on SPI (SCK 43, MISO 45, MOSI 44),
; TCXO 1.8 V, DIO2 RF switch, radio power enable on P1.05 (37). Battery on
; WB_A0 (P0.05) behind 1.5M/1M.
[env:rak4631]
extends = nrf52
build_flags =
  ${nrf52.build_flags}
  -DBOARD_NAME=\"rak4631\"
  -DRADIO_SCK=43 -DRADIO_MISO=45 -DRADIO_MOSI=44
  -DRADIO_CS=42 -DRADIO_DIO1=47 -DRADIO_RST=38 -DRADIO_BUSY=46
  -DRADIO_TCXO_MV=1800 -DRADIO_DIO2_RF_SWITCH=1 -DRADIO_POWER_PIN=37
  -DLED_PIN=35
  -DBATTERY_ADC_PIN=5 -DBATTERY_MULT_X100=173

; LilyGO T-Echo: SX1262 on SPI (SCK 19, MISO 23, MOSI 22), TCXO 1.8 V, DIO2 RF
; switch. E-ink and GPS are not driven yet. Battery on P0.04.
[env:techo]
extends = nrf52
build_flags =
  ${nrf52.build_flags}
  -DBOARD_NAME=\"techo\"
  -DRADIO_SCK=19 -DRADIO_MISO=23 -DRADIO_MOSI=22
  -DRADIO_CS=24 -DRADIO_DIO1=20 -DRADIO_RST=25 -DRADIO_BUSY=17
  -DRADIO_TCXO_MV=1800 -DRADIO_DIO2_RF_SWITCH=1
  -DLED_PIN=14
  -DBATTERY_ADC_PIN=4 -DBATTERY_MULT_X100=490
