; Mava custom board firmware (docs/board.md): ESP32-S3-N16R8 + SX1262.
;
;   pio run                                 build
;   pio run -t upload                       flash over USB-C
;   pio device monitor                      log (device password, what is heard) until a host attaches
;
; The protocol, router, MAC, store, node application and the Meshtastic
; adapter are in lib/ (pure C++17, tested on the host with `make test`); src/
; only moves bytes between them and the SX1262 (RadioLib), USB, BLE (NimBLE),
; Wi-Fi and LittleFS.
;
; Region defaults to EU_868 (869.525 MHz, Meshtastic LongFast's EU frequency);
; change it in the setup panel or with `mesh lora set region=…`. Check local
; rules before transmitting.

[platformio]
default_envs = mava_handheld_s3
src_dir = src
lib_dir = lib
boards_dir = boards

[env:mava_handheld_s3]
platform = espressif32
framework = arduino
board = esp32-s3-n16r8
monitor_speed = 115200
lib_ldf_mode = deep
lib_deps =
  jgromes/RadioLib@^7.3.0
  h2zero/NimBLE-Arduino@^2.5.1
  lvgl/lvgl@9.2.2
  ; Opus 1.6 (fixed point) for calls (src/calls.cpp), pinned
  https://github.com/pschatzmann/codec-opus.git#c02de6316dddbb9dffdf976c159c4eaacecdf12f
  ; JPEG decoding for the far side's camera in calls (MJPEG, src/ui/video.cpp)
  bitbank2/JPEGDEC@^1.8.4
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_unflags = -std=gnu++11 -std=gnu++14
extra_scripts = pre:scripts/patch_lvgl.py
build_src_flags = -Wall -Wextra
; Pins (docs/handheld-proto.md §2). The keyboard — our 7 × 7 matrix (A), a
; BlackBerry 9900 keyboard (B) or the 9900 keyboard + trackpad (C) — is on
; the keyboard module (firmware/keyboard, RP2040) at I2C 0x1F; the module
; reports which one it is, so this one build serves all three versions.
build_flags =
  -std=gnu++17
  -DMESH_DEFAULT_REGION=0
  -DMESH_FIRMWARE_VERSION=1
  ; 256 stored packets (PSRAM): a phone that passes on its relay traffic fills 64 in seconds
  -DMESH_STORE_SLOTS=256
  -DRADIOLIB_EXCLUDE_LORAWAN=1
  ; Pre-release hardware simulators (src/hwsim, lib/hwsim): the phone as screen, keys and
  ; audio over USB. Off in the v1 env below.
  -DMAVA_HWSIM=1
  ; NimBLE's buffer pool: 20 blocks instead of 12 (~2 kB); ble.cpp keeps 8 free for
  ; the replies to phones' writes and sends notifications from the rest
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=20
  -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
  -DBOARD_NAME=\"Mava\"
  -DBOARD_HAS_PSRAM
  -DRADIO_SCK=12 -DRADIO_MISO=13 -DRADIO_MOSI=11
  -DRADIO_CS=10 -DRADIO_DIO1=1 -DRADIO_BUSY=4 -DRADIO_RST=8
  -DRADIO_TCXO_MV=1800 -DRADIO_DIO2_RF_SWITCH=1
  ; The whole display on the DevKitC's left header (owner, 2026-11-18): in the
  ; display header's order CS 15, RESET 16, DC 17, SDI 18, SCK 3, LED 46, SDO 9.
  -DLCD_SCK=3 -DLCD_MOSI=18 -DLCD_MISO=9 -DLCD_CS=15 -DLCD_DC=17 -DLCD_RST=16 -DLCD_BL=46
  -DTOUCH_CS=5 -DTOUCH_IRQ=6 -DSD_CS=7
  -DI2S_MCLK=39 -DI2S_BCLK=40 -DI2S_LRCK=41 -DI2S_DIN=42 -DI2S_DOUT=45
  -DI2C_SDA=47 -DI2C_SCL=48
  -DKB_INT=21 -DSETUP_SWITCH_PIN=14 -DVIBRA_PIN=38
  ; Navigation keys without the keyboard module (owner, 2026-11-18): nine buttons
  ; on one ADC pin as a resistor ladder (lib/meshkeys ladder.h, handheld-proto.md §2)
  -DNAV_KEYS_PIN=2
  ; LVGL (no lv_conf.h): ILI9341 driver, Persian shaping + right-to-left,
  ; QR codes, the C library's malloc (PSRAM). Text font: src/ui/fonts (Vazirmatn).
  -DLV_CONF_SKIP -DLV_COLOR_DEPTH=16 -DLV_USE_ILI9341=1
  -DLV_USE_BIDI=1 -DLV_USE_ARABIC_PERSIAN_CHARS=1
  -DLV_FONT_MONTSERRAT_14=1 -DLV_USE_QRCODE=1
  -DLV_USE_STDLIB_MALLOC=1 -DLV_USE_STDLIB_STRING=1 -DLV_USE_STDLIB_SPRINTF=1

; v1 (stable) releases: the same board without the pre-release hardware
; simulators — no screen mirror, phone keys or phone audio over USB; those ops
; answer "unknown". scripts/build-flasher.sh picks it for versions without "-".
[env:mava_handheld_s3_v1]
extends = env:mava_handheld_s3
build_unflags = ${env:mava_handheld_s3.build_unflags} -DMAVA_HWSIM=1
