; Keyboard module firmware (docs/handheld-proto.md §3): a Raspberry Pi Pico
; (RP2040) scans the handheld's keyboard — and the BlackBerry trackpad in
; version C — and is an I2C target (0x1F) for the ESP32-S3.
;
;   pio run -e kb_matrix   version A: our 7 × 7 diode matrix
;   pio run -e kb_bb9900   version B: BlackBerry 9900 keyboard
;   pio run -e kb_bb9900tp version C: BlackBerry 9900 keyboard + trackpad
;
; Flash: hold BOOTSEL while plugging the Pico in, copy .pio/build/<env>/firmware.uf2.

[platformio]
default_envs = kb_matrix, kb_bb9900, kb_bb9900tp
lib_dir = ../lib

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep
lib_ignore = meshnode, meshroute, meshproto, meshtastic, monocypher
build_unflags = -std=gnu++14
build_flags = -std=gnu++17

[env:kb_matrix]
build_flags = ${env.build_flags} -DKB_VARIANT=0 -DKB_COLS=7

[env:kb_bb9900]
build_flags = ${env.build_flags} -DKB_VARIANT=1 -DKB_COLS=6

[env:kb_bb9900tp]
build_flags = ${env.build_flags} -DKB_VARIANT=2 -DKB_COLS=6 -DHAS_TRACKPAD=1
